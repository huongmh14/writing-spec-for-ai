name: Validate Skill Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: SDO, Ratchets, Links & Encoding Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run scripts/validate.ps1
        shell: pwsh
        run: ./scripts/validate.ps1
